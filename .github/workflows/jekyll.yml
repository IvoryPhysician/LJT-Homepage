name: Deploy Academic Pages template site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
      - name: Configure and verify GitHub Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Switching Pages source to gh-pages..."
          gh api --method PUT "/repos/$GITHUB_REPOSITORY/pages" \
            -f 'source[branch]=gh-pages' \
            -f 'source[path]=/' || true
          echo "Current Pages configuration:"
          gh api "repos/$GITHUB_REPOSITORY/pages" || true
          sleep 30
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -L -s -o /tmp/homepage.html -w "%{http_code}" "https://ivoryphysician.github.io/LJT-Homepage/" || true)
            echo "Attempt ${attempt}: HTTP ${code}"
            if [ "${code}" = "200" ] && grep -q "Junteng Liu" /tmp/homepage.html; then
              echo "Deployed homepage content verified."
              exit 0
            fi
            sleep 20
          done
